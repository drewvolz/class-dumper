name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "ClassDumper/**"
      - "ClassDumper.xcodeproj/**"
      - "ClassDumperTests/**"
      - "ClassDumperUITests/**"
      - "class-dump"
      - "contrib/**"

jobs:
  build:
    name: Build
    runs-on: xcode-27
    strategy:
      matrix:
        platform:
          - macOS
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0

      # Pin the exact Xcode app: the image also ships betas, and version-range
      # selection (e.g. mxcl/xcodebuild) can resolve to one
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Build and Test
        run: >
          xcodebuild test
          -scheme ClassDumper
          -destination "platform=${{ matrix.platform }}"
          -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-${{ matrix.platform }}
          path: TestResults.xcresult
